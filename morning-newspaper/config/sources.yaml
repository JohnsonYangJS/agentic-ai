runtime:
  output_dir: runtime
  lookback_days: 3

fixed_sources:
  - id: github_high_stars
    enabled: true
    source_group: primary
    source_type: github_high_stars
    source_name: GitHub 高星项目
    max_items: 6
    endpoint: https://api.github.com/search/repositories
    auth_env: GITHUB_TOKEN
    since_days: 3
    min_stars: 80
    per_query_limit: 10
    # languages 保留：collector 会先发「按语言 + 高星 + 新建」的查询，能取到真实热门仓库。
    # extra_queries 只用干净 topic —— topic:developer-tools 已被 SEO/破解刷星仓库占领
    # （实测 5/5 为 “Pre-activated standalone installer” 类），改用 self-hosted/terminal/cli-app。
    languages: [Python, TypeScript, Go, Rust]
    extra_queries: [topic:self-hosted, topic:terminal, topic:cli-app]

  - id: hackernews_top
    enabled: true
    source_group: primary
    source_type: hackernews_top
    source_name: Hacker News 热门故事
    max_items: 6
    endpoint: https://hacker-news.firebaseio.com/v0
    stories_type: topstories
    max_stories: 20
    timeout_seconds: 15

  - id: github_blog
    enabled: true
    source_group: background
    source_type: rss
    source_name: GitHub 官方博客
    max_items: 2
    url: https://github.blog/feed/

  - id: martinfowler
    enabled: true
    source_group: background
    source_type: rss
    source_name: Martin Fowler 技术专栏
    max_items: 1
    url: https://martinfowler.com/feed.atom

paused_sources:
  - id: github_security_advisories
    reason: 先暂停，避免安全公告把开发者工具情报带成漏洞简报。

# 邮箱提醒：独立链路，产物为 runtime/executive_mailbox.json（紧急事务卡片）
# 与 runtime/mail_event_queue.json（未来事项队列），不参与 Top10 排序。
# Outlook.com 已关闭 IMAP Basic 认证（服务器声明 LOGINDISABLED），故走 OAuth2：
# 首次需执行 `python scripts/microsoft_oauth_login.py` 完成浏览器授权，
# 拿到 MS_OAUTH_REFRESH_TOKEN 后即可自动续期。
assistant_mailbox:
  enabled: true
  id: executive_mailbox
  source_name: 邮箱提醒
  source_group: background
  host: outlook.office365.com
  port: 993
  folders: [INBOX]
  user_env: IMAP_USER
  pass_env: IMAP_PASS
  lookback_hours: 72
  initial_backfill_hours: 168
  max_messages: 50
  max_items: 10
  event_emit_window_days: 3
  urgent_keywords: [会议, 开会, 截止, 到期, 面试, 审批, 提醒, deadline, meeting, interview]
  important_keywords: [安排, 确认, 变更, 延期, 取消, agenda, schedule, reschedule]
  vip_senders: []
  ignored_senders: [noreply@github.com, no-reply@github.com]
  ignored_subject_keywords: [github-notifications, verify your email, 验证码]

tavily_search:
  enabled: true
  provider: tavily-rest-api
  max_items_per_topic: 3
  recency_days: 3
  fallback_recency_days: 3
  topics:
    - id: devtools_ide_terminal
      name: 开发者工具与编辑器
      query: developer tools IDE editor extension terminal CLI productivity release
      domains: [code.visualstudio.com, jetbrains.com, github.blog, stackoverflow.blog, news.ycombinator.com]
    - id: oss_selfhosted_infra
      name: 开源基础设施与自托管
      query: open source self-hosted infrastructure homelab database observability CI/CD
      domains: [github.com, news.ycombinator.com, cncf.io, kubernetes.io, grafana.com, martinfowler.com]
    - id: saas_indie_global
      name: SaaS 出海与独立开发者商业化
      query: SaaS indie hacker product launch pricing growth payments going global
      domains: [indiehackers.com, stripe.com, producthunt.com, techcrunch.com, theverge.com]
    - id: engineering_practice
      name: 工程实践与技术决策
      query: engineering practice architecture decision refactoring performance technical debt
      domains: [martinfowler.com, infoq.com, thoughtworks.com, netflixtechblog.com, engineering.fb.com, blog.cloudflare.com]

# 短筛阶段的时效硬过滤：超过该天数的条目不进候选池（早报是「今天」的日报）
title_shortlist:
  max_age_days: 7
